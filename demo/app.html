<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>mdEditDiff, live demo</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="demo" id="demo">
  <div class="tour" id="tour" role="toolbar" aria-label="Guided tour">
    <div class="chips" id="chips"></div>
    <button class="play" id="play" type="button" aria-pressed="false">▶ Play tour</button>
  </div>

  <div class="window" id="window">
    <div class="titlebar">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="title">
        <strong id="file">export-plan.md</strong>
        <span id="subtitle">History r1</span>
      </div>
      <div class="modes" role="group" aria-label="Document mode">
        <button type="button" data-mode="read" aria-pressed="true" title="Read (⌘1)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5c2.3-.9 4.6-.8 7 .6v11c-2.4-1.4-4.7-1.5-7-.6zM17 4.5c-2.3-.9-4.6-.8-7 .6v11c2.4-1.4 4.7-1.5 7-.6z"/></svg>
          Read
        </button>
        <button type="button" data-mode="edit" aria-pressed="false" title="Edit (⌘2)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 4H5a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 5 16h9a1.5 1.5 0 0 0 1.5-1.5V11"/><path d="M14.5 3.5l2 2L10 12l-2.7.7L8 10z"/></svg>
          Edit
        </button>
        <button type="button" data-mode="split" aria-pressed="false" title="Split (⌘3)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1.6"/><path d="M10 4v12"/></svg>
          Split
        </button>
      </div>
      <div class="actions">
        <button type="button" class="changes" id="changes" disabled title="Go to the next change (⌘])">
          <span class="dot" aria-hidden="true"></span><span id="changes-label">Up to date</span>
        </button>
        <button type="button" class="icon" id="history-button" aria-label="Version history" title="Version history (⇧⌘H)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.2 7.2A6.5 6.5 0 1 1 3.5 11"/><path d="M3.6 3.8v3.6h3.6"/><path d="M10 6.5V10l2.6 1.8"/></svg>
        </button>
      </div>
    </div>

    <div class="content" id="content" data-mode="read">
      <div class="editor">
        <textarea id="source" spellcheck="false" autocomplete="off" aria-label="Markdown source"></textarea>
      </div>
      <iframe id="preview" title="The formatted document, rendered by the app's own preview code" src="engine/preview.html"></iframe>
      <div class="agent" id="agent" hidden aria-live="polite">
        <div class="agent-head"><span class="agent-dot" aria-hidden="true"></span><span id="agent-name">planner</span> · coding agent</div>
        <pre id="agent-log"></pre>
      </div>
      <div class="keycap" id="keycap" hidden aria-hidden="true"></div>
    </div>
  </div>

  <div class="caption">
    <div class="caption-text" id="caption" aria-live="polite"></div>
    <div class="caption-side">
      <span class="progress" id="progress"></span>
      <button type="button" class="reset" id="reset">Reset ↺</button>
    </div>
  </div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
</div>
<script src="sample.js"></script>
<script src="app.js"></script>
</body>
</html>
